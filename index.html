<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101820"><title>BEER MASTER</title>
<style>
:root{color-scheme:dark;--bg:#101820;--panel:#1b2933;--gold:#f5bd4f;--foam:#fff3d6;--muted:#a9b8c2}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#263d4a,var(--bg) 58%);color:#f7f7f2;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;min-height:100svh}
main{width:min(100%,480px);margin:auto;padding:22px 16px 34px;text-align:center}.brand{letter-spacing:.2em;font-size:12px;color:var(--gold);font-weight:800}.title{font-size:32px;font-weight:900;margin:5px 0 4px}.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
.panel{background:#1b2933eF;border:1px solid #ffffff18;border-radius:22px;padding:17px;margin:13px 0;box-shadow:0 12px 30px #0003}
.target{font-size:13px;color:var(--muted)}.target strong{display:block;color:var(--gold);font-size:34px;margin-top:2px}
.stage{height:300px;position:relative;display:flex;align-items:flex-end;justify-content:center;padding-bottom:12px;overflow:hidden}
.glass{width:142px;height:235px;border:4px solid #dce7e9;border-top:0;border-radius:4px 4px 24px 24px;position:relative;overflow:hidden;background:#ffffff08;box-shadow:inset 0 0 18px #fff2,0 8px 22px #0004;z-index:1}
.beer{position:absolute;bottom:0;left:0;width:100%;height:0;background:linear-gradient(90deg,#b66a12,#f4b638 48%,#d88718);transition:height .08s linear}
.foam{position:absolute;left:0;width:100%;height:0;background:linear-gradient(#fffdf2,#f4e6c4);transition:height .08s linear;z-index:2}
.bubbles{position:absolute;inset:0;background-image:radial-gradient(#fff9 1px,transparent 2px),radial-gradient(#fff6 1px,transparent 2px);background-size:23px 29px,31px 37px;background-position:0 0,10px 13px;opacity:.28;pointer-events:none;z-index:3}
.glass-mark{position:absolute;right:7px;top:8px;color:#ffffff70;font-size:9px;writing-mode:vertical-rl;letter-spacing:.1em;z-index:4}
.bottle-wrap{position:absolute;left:calc(50% - 110px);top:18px;width:220px;height:105px;transform-origin:24px 78px;z-index:5;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}.bottle-wrap.dragging{cursor:grabbing;filter:drop-shadow(0 0 8px #f5bd4f88)}
.bottle{position:absolute;right:0;top:28px;width:175px;height:54px;border-radius:15px 22px 22px 15px;background:linear-gradient(180deg,#8eae62,#476c37 45%,#29452b 70%,#79994e);border:2px solid #a5bd78;box-shadow:inset 0 5px 8px #ffffff35,0 7px 12px #0005}
.bottle:before{content:"";position:absolute;left:-34px;top:13px;width:38px;height:25px;border-radius:5px 0 0 5px;background:linear-gradient(#78984c,#395c32);border:2px solid #9bb36d}
.bottle:after{content:"";position:absolute;left:-42px;top:15px;width:10px;height:21px;border-radius:3px;background:#c8b77b;border:1px solid #eee0a8}
.bottle-label{position:absolute;left:54px;top:9px;width:70px;height:34px;background:#eee4c2;color:#4b432b;border-radius:4px;font-size:9px;font-weight:900;display:grid;place-items:center;letter-spacing:.08em}
.stream{position:absolute;left:0;top:78px;width:4px;height:0;background:linear-gradient(90deg,#f6d17b,#fff0b5);border-radius:8px;transform:rotate(-18deg);transform-origin:top;opacity:.9;z-index:4}
.stats{display:flex;justify-content:space-around;color:var(--muted);font-size:11px;margin-top:8px}.stats b{display:block;color:white;font-size:19px;margin-top:3px}
.rounddots{display:flex;gap:6px;justify-content:center;margin:12px}.dot{width:8px;height:8px;border-radius:50%;background:#52636d}.dot.done{background:var(--gold)}
.anglebox{background:#263a45;border-radius:16px;padding:12px 14px;margin-top:12px;text-align:center}.angle-head{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}.angle-head strong{font-size:22px;color:var(--gold)}.scale{display:flex;justify-content:space-between;font-size:10px;color:var(--muted)}
.action{background:#344956;color:white;width:100%;border:0;border-radius:15px;padding:15px;font:inherit;font-weight:800;margin-top:13px}
.hint{font-size:12px;color:var(--muted);line-height:1.65;margin:11px 0 0}.hidden{display:none!important}.result-score{font-size:52px;color:var(--gold);font-weight:900}.result-title{font-size:23px;font-weight:900;margin:4px}.achievement{background:#263a45;border-radius:14px;padding:12px;margin:8px 0;text-align:left;font-size:13px}.achievement b{color:var(--gold)}
</style></head>
<body><main>
<div class="brand">THE PERFECT POUR CHALLENGE</div><div class="title">BEER MASTER</div><p class="sub">瓶の角度を操って、理想の泡をつくれ。</p>
<section id="game"><div class="panel">
<div class="target">今回のお題 <strong id="target">泡 25%</strong></div>
<div class="stage">
<div class="bottle-wrap" id="bottleWrap" role="button" aria-label="瓶をつかんで上下に動かして傾ける"><div class="bottle"><div class="bottle-label">BEER</div></div></div>
<div class="stream" id="stream"></div>
<div class="glass"><div class="beer" id="beer"></div><div class="foam" id="foam"></div><div class="bubbles"></div><div class="glass-mark">BEER MASTER</div></div>
</div>
<div class="stats"><div>ビール<b id="beerVal">0%</b></div><div>泡<b id="foamVal">0%</b></div><div>合計<b id="totalVal">0%</b></div></div>
<div class="rounddots" id="dots"></div>
<div class="anglebox"><div class="angle-head"><span>🍾 瓶の傾き</span><strong><span id="angleVal">35</span>°</strong></div><div class="scale"><span>水平：ビール多め</span><span>立てる：泡多め</span></div></div>
<p class="hint">瓶を指でつかんで上下に動かそう。瓶を傾けている間だけ注がれるよ。</p>
<button class="action" id="judgeBtn">この一杯を完成させる</button>
</div></section>
<section id="result" class="panel hidden"><div class="target">ROUND RESULT</div><div class="result-score" id="score">--</div><div class="result-title" id="resultTitle"></div><p id="resultText" class="hint"></p><button class="action" id="nextBtn">次のラウンドへ</button></section>
<section id="final" class="panel hidden"><div class="target">YOUR RANK</div><div class="result-title" id="rankTitle"></div><div class="result-score" id="finalScore"></div><p class="hint" id="finalText"></p><div id="badges"></div><button class="action" id="restartBtn">もう一度挑戦する</button></section>
</main>
<script>
(()=>{const $=id=>document.getElementById(id);let beer=0,foam=0,target=25,round=1,scores=[],timer=null,angle=35,dragStartY=0,dragStartAngle=35;
function setTarget(){target=Math.floor(Math.random()*31)+10;$('target').textContent='泡 '+target+'%';}
function render(){$('beer').style.height=beer+'%';$('foam').style.bottom=beer+'%';$('foam').style.height=foam+'%';$('beerVal').textContent=Math.round(beer)+'%';$('foamVal').textContent=Math.round(foam)+'%';$('totalVal').textContent=Math.round(beer+foam)+'%';$('dots').innerHTML=Array.from({length:5},(_,i)=>'<span class="dot '+(i<round?'done':'')+'"></span>').join('');}
function angleChange(){$('angleVal').textContent=Math.round(angle);$('bottleWrap').style.transform='rotate('+(-angle+15)+'deg)';}
function pourStep(){let total=beer+foam;if(total>=100){stop();return}let share=0.08+((angle-15)/70)*0.62;let flow=0.68;let add=Math.min(flow,100-total);let nextFoam=foam+add*share;let nextBeer=beer+add*(1-share);let scale=(beer+foam+add)>100? (100-total)/add:1;foam+=add*share*scale;beer+=add*(1-share)*scale;let exact=beer+foam;if(exact>100){beer*=100/exact;foam*=100/exact}render();$('stream').style.height='42px';}
function stop(){if(timer)clearInterval(timer);timer=null;$('stream').style.height='0';$('bottleWrap').classList.remove('dragging');}
const bottle=$('bottleWrap');
bottle.addEventListener('pointerdown',e=>{e.preventDefault();bottle.setPointerCapture(e.pointerId);bottle.classList.add('dragging');dragStartY=e.clientY;dragStartAngle=angle;timer=setInterval(pourStep,55)});
bottle.addEventListener('pointermove',e=>{if(!bottle.classList.contains('dragging'))return;angle=Math.max(15,Math.min(85,dragStartAngle+(dragStartY-e.clientY)*0.65));angleChange()});
['pointerup','pointercancel','lostpointercapture'].forEach(ev=>bottle.addEventListener(ev,stop));
document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});
function reset(){beer=0;foam=0;angle=35;angleChange();render();setTarget();}
function judge(){stop();let total=beer+foam,actual=total?foam/total*100:0;let fillError=Math.abs(100-total),foamError=Math.abs(target-actual);let score=Math.max(0,Math.round(100-(foamError*1.7)-(fillError*1.25)));if(total<35)score=Math.min(score,25);scores.push(score);$('game').classList.add('hidden');$('result').classList.remove('hidden');$('score').textContent=score+'点';let t=score>=95?'神泡マスター':score>=85?'職人級':score>=70?'上出来！':score>=50?'あと一歩':'修行中';$('resultTitle').textContent=t;$('resultText').textContent='目標の泡 '+target+'% ／ 実際の泡 '+Math.round(actual)+'% ／ 注いだ量 '+Math.round(total)+'%';$('nextBtn').textContent=round===5?'最終結果を見る':'次のラウンドへ';}
$('judgeBtn').addEventListener('click',judge);
$('nextBtn').addEventListener('click',()=>{if(round===5){finish();return}round++;$('result').classList.add('hidden');$('game').classList.remove('hidden');reset()});
function finish(){let avg=Math.round(scores.reduce((a,b)=>a+b,0)/5);let rank=avg>=95?'伝説のビールマスター':avg>=85?'ゴールドバーテンダー':avg>=70?'一流注ぎ師':avg>=50?'ビール見習い':'泡との戦いは続く…';let badges=[];if(Math.max(...scores)>=95)badges.push('🏆 <b>神業の一杯</b>：95点以上を獲得');if(scores.every(s=>s>=70))badges.push('🎖️ <b>安定の職人</b>：全ラウンド70点以上');if(scores[4]>=scores[0])badges.push('📈 <b>成長株</b>：最終ラウンドで初回以上');$('result').classList.add('hidden');$('final').classList.remove('hidden');$('rankTitle').textContent=rank;$('finalScore').textContent=avg+'点';$('finalText').textContent='5杯の平均スコア：'+avg+'点';$('badges').innerHTML=badges.length?badges.map(x=>'<div class="achievement">'+x+'</div>').join():'<div class="achievement">🍺 <b>挑戦者</b>：次は実績解除を目指そう！</div>'}
$('restartBtn').addEventListener('click',()=>{round=1;scores=[];$('final').classList.add('hidden');$('game').classList.remove('hidden');reset()});reset();
})();
</script></body></html>

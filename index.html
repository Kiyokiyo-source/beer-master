<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101820"><title>BEER MASTER</title>
<style>
:root{color-scheme:dark;--bg:#101820;--gold:#f5bd4f;--muted:#a9b8c2}
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(circle at 50% 0,#263d4a,var(--bg) 58%);color:#f7f7f2;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif}
main{width:min(100%,480px);margin:auto;padding:22px 16px 34px;text-align:center}.brand{letter-spacing:.2em;font-size:12px;color:var(--gold);font-weight:800}.title{font-size:32px;font-weight:900;margin:5px 0 4px}.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
.panel{background:#1b2933ef;border:1px solid #ffffff18;border-radius:22px;padding:16px;margin:13px 0;box-shadow:0 12px 30px #0003}
.target{font-size:13px;color:var(--muted)}.target strong{display:block;color:var(--gold);font-size:34px;margin-top:2px}
.stage{height:390px;position:relative;overflow:hidden;border-radius:16px;background:radial-gradient(ellipse at 50% 90%,#263e49 0%,#1a2a34 68%);margin-top:10px;touch-action:pan-y}
.glass{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);width:142px;height:235px;border:4px solid #dce7e9;border-top:0;border-radius:4px 4px 24px 24px;overflow:hidden;background:#ffffff08;box-shadow:inset 0 0 18px #fff2,0 8px 22px #0004;z-index:1}
.beer{position:absolute;bottom:0;left:0;width:100%;height:0;background:linear-gradient(90deg,#a95d0d,#f6c34e 38%,#e99a20 72%,#b86b12);transition:height .07s linear;box-shadow:inset 0 0 12px #fff3}.beer:before{content:"";position:absolute;left:-8%;top:-5px;width:116%;height:9px;border-radius:50%;background:linear-gradient(90deg,#e9a52e,#ffe08a 45%,#d88a1d);animation:liquidWave .8s ease-in-out infinite alternate}
.foam{position:absolute;left:0;width:100%;height:0;background:linear-gradient(90deg,#e9dfbd,#fffdf2 45%,#f2e5c8);z-index:2;transition:height .07s linear,bottom .07s linear;box-shadow:inset 0 3px 7px #fff9}.foam:before{content:"";position:absolute;left:0;right:0;top:-3px;height:7px;border-radius:50%;background:#fffdf2;filter:blur(1px)}
.bubbles{position:absolute;inset:0;background-image:radial-gradient(#fff9 1px,transparent 2px),radial-gradient(#fff6 1px,transparent 2px),radial-gradient(#fff8 2px,transparent 3px);background-size:23px 29px,31px 37px,41px 47px;background-position:0 0,10px 13px,19px 7px;opacity:.3;pointer-events:none;z-index:3;animation:bubbleRise 2.8s linear infinite}
.glass-mark{position:absolute;right:7px;top:8px;color:#ffffff70;font-size:9px;writing-mode:vertical-rl;letter-spacing:.1em;z-index:4}
.bottle-wrap{position:absolute;left:0;top:0;width:220px;height:105px;transform-origin:8px 53px;z-index:5;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.bottle-wrap.dragging{cursor:grabbing;filter:drop-shadow(0 0 8px #f5bd4f88)}
.bottle{position:absolute;right:0;top:28px;width:175px;height:54px;border-radius:15px 22px 22px 15px;background:linear-gradient(180deg,#8eae62,#476c37 45%,#29452b 70%,#79994e);border:2px solid #a5bd78;box-shadow:inset 0 5px 8px #ffffff35,0 7px 12px #0005}
.bottle:before{content:"";position:absolute;left:-34px;top:13px;width:38px;height:25px;border-radius:5px 0 0 5px;background:linear-gradient(#78984c,#395c32);border:2px solid #9bb36d}
.bottle:after{content:"";position:absolute;left:-42px;top:15px;width:10px;height:21px;border-radius:3px;background:#c8b77b;border:1px solid #eee0a8}
.bottle-label{position:absolute;left:54px;top:9px;width:70px;height:34px;background:#eee4c2;color:#4b432b;border-radius:4px;font-size:9px;font-weight:900;display:grid;place-items:center;letter-spacing:.08em}
.stream{position:absolute;height:0;width:5px;background:linear-gradient(90deg,#c47a18,#ffe6a0 38%,#f4bd4e 70%,#fff0b5);border-radius:50%;z-index:4;pointer-events:none;transform-origin:top center;opacity:.95;filter:drop-shadow(0 0 3px #f5bd4f88);animation:streamPulse .16s ease-in-out infinite alternate}
.stats{display:flex;justify-content:space-around;color:var(--muted);font-size:11px;margin:13px 0 8px}.stats b{display:block;color:white;font-size:20px;margin-top:3px}
.status{display:flex;justify-content:space-between;gap:8px;margin-top:12px;background:#263a45;border-radius:14px;padding:11px 13px;color:var(--muted);font-size:12px}.status b{color:var(--gold)}
.hint{font-size:12px;color:var(--muted);line-height:1.7;margin:12px 2px 0}
.action{background:#344956;color:white;width:100%;border:0;border-radius:15px;padding:15px;font:inherit;font-weight:800;margin-top:13px}
.hidden{display:none!important}.result-score{font-size:52px;color:var(--gold);font-weight:900}.result-title{font-size:23px;font-weight:900;margin:4px}.achievement{background:#263a45;border-radius:14px;padding:12px;margin:8px 0;text-align:left;font-size:13px}.achievement b{color:var(--gold)}\n@keyframes liquidWave{from{transform:translateX(-2%) scaleY(.8)}to{transform:translateX(2%) scaleY(1.15)}}\n@keyframes bubbleRise{from{background-position:0 32px,10px 48px,19px 27px}to{background-position:0 -20px,10px -8px,19px -33px}}\n@keyframes streamPulse{from{opacity:.72}to{opacity:1}}
</style></head><body><main>
<div class="brand">THE PERFECT POUR CHALLENGE</div><div class="title">BEER MASTER</div><p class="sub">瓶を自由に動かして、最高の7:3を目指せ。</p>
<section id="game"><div class="panel">
<div class="target">今回のミッション <strong>目指せ！7：3</strong><span style="display:block;margin-top:2px">ビール70% ／ 泡30%</span></div>
<div class="stats"><div>ビール<b id="beerVal">0%</b></div><div>泡<b id="foamVal">0%</b></div><div>合計<b id="totalVal">0%</b></div></div>
<div class="stage" id="stage">
<div class="glass"><div class="beer" id="beer"></div><div class="foam" id="foam"></div><div class="bubbles"></div><div class="glass-mark">BEER MASTER</div></div>
<div class="stream" id="stream"></div>
<div class="bottle-wrap" id="bottleWrap" role="button" aria-label="瓶をつかんで持ち上げ、傾けて注ぐ"><div class="bottle"><div class="bottle-label">BEER</div></div></div>
</div>
<div class="status"><span>瓶の傾き <b id="angleVal">0°</b></span><span>目標 <b>ビール70%・泡30%</b></span></div>
<div class="hint" style="text-align:left;background:#263a45;border-radius:14px;padding:12px 14px;margin-top:14px"><b style="color:#f5bd4f">🍺 おいしく注ぐコツ</b><br>・瓶を浅い角度にすると、ゆっくり注げてビール多め。<br>・瓶を縦に近づけるほど、勢いよく注げて泡がたくさん出るよ。<br>・7:3を目指して、左へ動かす量で角度を調整しよう！</div>

</div></section>
<section id="result" class="panel hidden"><div class="target">YOUR RESULT</div><div class="result-score" id="score">--</div><div class="result-title" id="resultTitle"></div><p id="resultText" class="hint"></p><div id="badges"></div><button class="action" id="restartBtn">もう一度挑戦する</button></section>
</main>
<script>
(()=>{
const $=id=>document.getElementById(id),stage=$('stage'),bottle=$('bottleWrap'),glass=$('beer').parentElement;
let beer=0,foam=0,angle=0,pouring=false,drag=false,timer=null,judged=false;
let startX=0,startMouthX=0,baseMouthY=0,approachDistance=1,hasReachedCenter=false;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function render(){
 $('beer').style.height=beer+'%';$('foam').style.bottom=beer+'%';$('foam').style.height=foam+'%';
 $('beerVal').textContent=Math.round(beer)+'%';$('foamVal').textContent=Math.round(foam)+'%';
 $('totalVal').textContent=Math.round(beer+foam)+'%';
 $('angleVal').textContent=Math.round(angle)+'°';
}
function geometry(){
 const s=stage.getBoundingClientRect(),g=glass.getBoundingClientRect();
 return {center:g.left-s.left+g.width/2,top:g.top-s.top+4};
}
// The bottle cap center is the fixed pivot: local coordinate (8px, 53px).
function setMouth(x,y){bottle.style.left=(x-8)+'px';bottle.style.top=(y-53)+'px'}
function mouth(){return{x:parseFloat(bottle.style.left)+8,y:parseFloat(bottle.style.top)+53}}
function updateStream(p){
 const line=$('stream');
 if(!pouring){line.style.height='0';return}
 const g=geometry(),end={x:g.center,y:g.top+48};
 const dx=end.x-p.x,dy=end.y-p.y;
 line.style.left=p.x+'px';line.style.top=p.y+'px';
 line.style.height=Math.hypot(dx,dy)+'px';line.style.transform='rotate('+Math.atan2(dx,dy)+'rad)';
}
function pourStep(){
 if(!pouring)return;
 const g=geometry(),rate=.48+(angle/65)*1.12,foamShare=clamp(.10+(angle/65)*.48,.10,.58);
 // Pouring only begins once the bottle mouth reaches the center of the glass.
 const streamHitsGlass=mouth().x>=g.center-3&&mouth().x<=g.center+3;
 if(streamHitsGlass&&beer+foam<100){
   const add=Math.min(rate,100-beer-foam);beer+=add*(1-foamShare);foam+=add*foamShare;
 }
 render();updateStream(mouth());
 if(beer+foam>=99.999&&!judged){beer=100-foam;judged=true;render();stopPour();judge();}
}
function startPour(){if(timer||beer+foam>=100)return;pouring=true;pourStep();timer=setInterval(pourStep,55)}
function stopPour(){pouring=false;if(timer)clearInterval(timer);timer=null;$('stream').style.height='0'}
function positionForPointer(clientX){
 const g=geometry(),candidate=startMouthX+(clientX-startX);
 if(candidate>g.center){
   // Right of center: lift and tilt the upright bottle smoothly toward horizontal.
   hasReachedCenter=false;stopPour();angle=0;
   const progress=clamp((startMouthX-candidate)/approachDistance,0,1);
   setMouth(candidate,baseMouthY);
   bottle.style.transform='rotate('+(90*(1-progress))+'deg)';
 }else{
   // At center, the mouth becomes the pivot. Moving farther left tilts the body only.
   hasReachedCenter=true;setMouth(g.center,baseMouthY);
   angle=clamp((g.center-candidate)*.8,0,65);
   bottle.style.transform='rotate('+(-angle)+'deg)';
   if(!timer)startPour();
   updateStream(mouth());
 }
 $('angleVal').textContent=Math.round(angle)+'°';
}
bottle.addEventListener('pointerdown',e=>{
 e.preventDefault();bottle.setPointerCapture(e.pointerId);drag=true;bottle.classList.add('dragging');
 const g=geometry();startX=e.clientX;startMouthX=mouth().x;
 baseMouthY=g.top-8;approachDistance=Math.max(1,startMouthX-g.center);
});
bottle.addEventListener('pointermove',e=>{if(drag)positionForPointer(e.clientX)});
function release(){if(!drag)return;drag=false;bottle.classList.remove('dragging');stopPour()}
['pointerup','pointercancel','lostpointercapture'].forEach(ev=>bottle.addEventListener(ev,release));
function reset(){
 beer=0;foam=0;angle=0;judged=false;stopPour();hasReachedCenter=false;
 const g=geometry();baseMouthY=g.top-8;setMouth(g.center+105,baseMouthY);
 bottle.style.transform='rotate(90deg)';render();
}
function judge(){
 stopPour();const total=beer+foam,actual=total?foam/total*100:0;
 const ratioError=Math.abs(actual-30),fillError=Math.abs(100-total);
 let score=clamp(Math.round(100-ratioError*1.7-fillError*.8),0,100);
 if(total<25)score=Math.min(score,20);
 const title=score>=95?'伝説の7:3マスター':score>=85?'黄金比の職人':score>=70?'一流の注ぎ手':score>=50?'あと少し！':'泡修行中';
 $('score').textContent=score+'点';$('resultTitle').textContent=title;
 $('resultText').textContent='ビール '+Math.round(beer)+'% ／ 泡 '+Math.round(foam)+'% ／ 泡比率 '+Math.round(actual)+'%';
 let badges=[];if(score>=95)badges.push('🏆 神泡の黄金比を達成！');if(actual>=27&&actual<=33&&total>=85)badges.push('🍺 理想の7:3に到達！');
 $('badges').innerHTML=badges.map(x=>'<div class="achievement">'+x+'</div>').join('')||'<div class="achievement">🍻 次はもっと理想の7:3を目指そう！</div>';
 $('game').classList.add('hidden');$('result').classList.remove('hidden');
}

$('restartBtn').addEventListener('click',()=>{$('result').classList.add('hidden');$('game').classList.remove('hidden');reset()});
window.addEventListener('resize',()=>{if(!drag)reset()});
reset();
})();
</script></body></html>
